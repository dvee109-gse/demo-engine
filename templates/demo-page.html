<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{businessName}} — AI Demo</title>
<style>
  /* Before touching .phone-screen's max-height below: it must stay a
     viewport-relative value (85vh), never a fixed px number — see the
     warning comment on that rule for why. */
  :root { --accent: {{primaryColor}}; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    background: #0a0a12;
    background: radial-gradient(ellipse 90% 55% at 50% -10%, color-mix(in srgb, var(--accent) 32%, #0a0a12), #0a0a12 65%);
    color: #e4e4ea;
    min-height: 100vh;
  }
  header {
    padding: 2.75rem 1.5rem 1.25rem;
    text-align: center;
  }
  header img {
    max-height: 32px;
    margin-bottom: 0.85rem;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35));
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #fff, color-mix(in srgb, var(--accent) 65%, #fff));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* Scraped business summaries run long (multiple sentences) — clamped to 2
     lines so the header banner doesn't push the phone mockup below the fold
     on page load. Measured against a real 730px viewport (2026-08-18), not
     guessed — see commit message. */
  header p {
    margin: 0;
    opacity: 0.65;
    max-width: 32rem;
    margin-inline: auto;
    font-size: 0.85rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  main { max-width: 640px; margin: 0 auto 3rem; padding: 0 1.5rem; }
  .card {
    padding: 0;
    text-align: center;
  }
  .fineprint { font-size: 0.75rem; color: rgba(228,228,234,0.4); margin-top: 1.25rem; text-align: center; }

  /* Phone mockup: one shared frame, tap to switch between the voice and chat
     widgets instead of showing both GHL panels stacked on the page at once. */
  .phone {
    width: min(280px, 100%);
    margin: 1.5rem auto 0;
    background: linear-gradient(160deg, #24252f, #15161d);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    padding: 8px 6px 10px;
    box-shadow:
      0 24px 60px -12px rgba(0,0,0,0.6),
      0 0 90px -24px color-mix(in srgb, var(--accent) 55%, transparent);
    animation: phone-in 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes phone-in {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .mode-toggle {
    display: flex;
    gap: 0.3rem;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 8px;
  }
  .mode-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #9a9ba8;
    padding: 0.5rem 0.5rem;
    border-radius: 999px;
    font: inherit;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000));
    color: #fff;
    box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .phone-screen {
    background: #fff;
    border-radius: 18px;
    overflow-y: auto;
    /* ============================================================
       DO NOT replace max-height: 85vh with a fixed px value (420px,
       400px, 320px, 280px, 230px all tried and failed). GHL's chat
       widget correctly pins its own input row and scrolls its message
       list internally — but ONLY when its container isn't squeezed
       below its natural layout height. Every fixed px value broke
       that internal behavior and clipped the "Type a message" input
       off-screen, confirmed live and re-broken multiple times in this
       exact spot on 2026-08-18/19. If the frame looks too tall, fix
       it by shrinking the header/card sections above (see .header,
       .card), NOT this value.
       ============================================================ */
    max-height: 85vh;
  }
  .mode-panel[hidden] { display: none; }
  /* The voice widget is just a compact card (avatar + "Call us here"), which
     looked lost/tiny pinned to the top of a tall frame — center it instead.
     The chat widget fills the frame on its own (header/messages/input), so it
     doesn't need this. :not([hidden]) matters here: without it, this rule's
     display:flex has the same specificity as [hidden]'s display:none and
     wins on source order, making the "hidden" voice panel render anyway
     (confirmed live, 2026-08-18 — both panels showed stacked at once). */
  .mode-panel[data-panel="voice"]:not([hidden]) {
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Tried scaling the chat widget down to match Talk's compact size (height +
     transform:scale, several variations) — abandoned 2026-08-20. Confirmed
     via DevTools that <chat-widget> renders its actual UI (header, messages,
     input) through Shadow DOM, computed by GHL's own JS — not something
     external CSS can reliably reach or resize correctly. Chat is left at its
     natural size (governed by .phone-screen's max-height: 85vh above) rather
     than fighting this further; see if GHL's own Widget Dimension setting
     (Sites > Chat Widgets > Style) can shrink it correctly instead, since
     that's computed by GHL's own JS rather than fought from outside. */
</style>
</head>
<body>
  <header>
    {{#if logoUrl}}<img src="{{logoUrl}}" alt="{{businessName}} logo" />{{/if}}
    <h1>Meet {{businessName}}'s new AI employee</h1>
    <p>{{heroText}}</p>
  </header>

  <main>
    <div class="card">
      <div class="phone">
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="voice">🎙️ Talk</button>
          <button type="button" class="mode-btn" data-mode="chat">💬 Chat</button>
        </div>
        <div class="phone-screen">
          <!-- GHL Voice AI Chat Widget embed — the main feature of this demo,
               shown by default. Separate Sites > Chat Widgets entry (Agent
               tab -> Voice AI Agent), set to "Embedded/Inline" placement. -->
          <div class="mode-panel" data-panel="voice">{{voiceWidgetEmbed}}</div>

          <!-- GHL chat widget embed — secondary, hidden until "Chat" is
               tapped. Also set to "Embedded/Inline" placement, or it renders
               as a floating bubble instead of inline here. -->
          <div class="mode-panel" data-panel="chat" hidden>{{chatWidgetEmbed}}</div>
        </div>
      </div>

      <p class="fineprint">This is a live demo built from {{businessName}}'s public website — not a real employee, and no info you enter here is used outside this demo.</p>
    </div>
  </main>

  <script>
    // Tracking beacon: fires once, on first real interaction, back to the GHL
    // inbound-webhook workflow that moves the pipeline to "AI Mockup Opened".
    // Wired to the mode-toggle taps — a real signal of intent. GHL's chat/
    // voice widgets expose window.leadConnector.chatWidget and an
    // "LC_chatWidgetLoaded" event, but that fires on page load (script
    // ready), not on the visitor actually opening/using the widget, so it's
    // not a usable engagement signal — swap in a real open/message event if
    // GHL exposes one later.
    const BEACON_URL = "{{beaconUrl}}";
    let fired = false;
    function fireBeacon() {
      if (fired || !BEACON_URL) return;
      fired = true;
      fetch(BEACON_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contactId: "{{contactId}}", event: "demo_engaged" }),
      }).catch(() => {});
    }

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        fireBeacon();
        document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const mode = btn.dataset.mode;
        document.querySelectorAll(".mode-panel").forEach((p) => {
          p.hidden = p.dataset.panel !== mode;
        });
      });
    });
  </script>
</body>
</html>
